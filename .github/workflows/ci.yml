name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-bench:
    name: build + bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja and GLFW system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run benchmark and validate ratios
        run: |
          set -euo pipefail
          OUTPUT=$(./build/voxel_engine --bench)
          echo "$OUTPUT"

          # Every gated figure comes off the stable BENCH_SUMMARY line. The
          # greedy ratio used to be scraped out of a prose line instead
          # ('NN.NNx fewer quads'), which tied the gate to the wording of a
          # human-readable report; run_mesher_bench returns it now.
          SUMMARY=$(echo "$OUTPUT" | grep '^BENCH_SUMMARY ' | head -1)
          if [ -z "$SUMMARY" ]; then
            echo "Failed to find BENCH_SUMMARY line in --bench output"; exit 1
          fi
          GREEDY=$(echo "$SUMMARY"           | grep -oE 'greedy=[0-9]+\.[0-9]+'           | cut -d= -f2)
          CHUNK_TIGHT=$(echo "$SUMMARY"      | grep -oE 'chunk_tight=[0-9]+\.[0-9]+'      | cut -d= -f2)
          SECTION_NONEMPTY=$(echo "$SUMMARY" | grep -oE 'section_nonempty=[0-9]+\.[0-9]+' | cut -d= -f2)
          SECTION_TOTAL=$(echo "$SUMMARY"    | grep -oE 'section_total=[0-9]+\.[0-9]+'    | cut -d= -f2)
          OCCL_CAVE=$(echo "$SUMMARY"        | grep -oE 'occl_cave=[0-9]+\.[0-9]+'        | cut -d= -f2)
          WORLD_MESH=$(echo "$SUMMARY"       | grep -oE 'world_mesh_mb=[0-9]+\.[0-9]+'   | cut -d= -f2)
          VERTEX_BYTES=$(echo "$SUMMARY"     | grep -oE 'vertex_bytes=[0-9]+'           | cut -d= -f2)
          NAIVE_MESH=$(echo "$SUMMARY"       | grep -oE 'world_mesh_naive_mb=[0-9]+\.[0-9]+' | cut -d= -f2)

          echo "Measured: greedy=${GREEDY}x  chunk_tight=${CHUNK_TIGHT}x  section_nonempty=${SECTION_NONEMPTY}x  section_total=${SECTION_TOTAL}x  occl_cave=${OCCL_CAVE}x  world_mesh=${WORLD_MESH}MB"

          # Thresholds carry ~10% slack below current measurements
          # (M4 5.33 greedy / 2.96 / 3.09 / 12.35).
          # If GH-hosted runners drift further, raise the slack rather than tightening the code.
          gate() {
              awk -v name="$1" -v val="$2" -v min="$3" \
                'BEGIN { if (val+0 < min+0) { printf "%s = %s below threshold %s\n", name, val, min; exit 1 }
                         else                 { printf "%s = %s OK (>= %s)\n",        name, val, min } }'
          }
          # A memory figure regresses upward, so it needs the opposite test.
          gate_max() {
              awk -v name="$1" -v val="$2" -v max="$3" \
                'BEGIN { if (val+0 > max+0) { printf "%s = %s above ceiling %s\n", name, val, max; exit 1 }
                         else                 { printf "%s = %s OK (<= %s)\n",       name, val, max } }'
          }
          # Counts only faces a camera can reach: the gate chunk is meshed against
          # its four real neighbours, so faces buried against the next chunk are
          # never emitted by either mesher. Measured 5.33x. The chunk-local
          # figure this replaced was 18.1x, and most of that gap was the naive
          # baseline emitting one face per block along boundaries the greedy
          # mesher merged into a rectangle - work neither should have done.
          gate greedy            "$GREEDY"            4.5
          gate chunk_tight       "$CHUNK_TIGHT"       2.7
          gate section_nonempty  "$SECTION_NONEMPTY"  2.8
          gate section_total     "$SECTION_TOTAL"    11.0
          # Measured 70.8x on M4; the drawn count in the cave is tiny (~4
          # sections) so the ratio is sensitive to mesher/terrain tweaks.
          # Gate loosely: the claim is "order of magnitude underground".
          gate occl_cave         "$OCCL_CAVE"        10.0
          # Whole-world GPU mesh bytes at radius 12: the README's headline
          # memory number. Deterministic (same seed, same terrain, pure
          # arithmetic over the meshes), so the bounds are tight. The
          # ceiling catches a fatter vertex or a reintroduced per-chunk
          # index buffer; the floor catches a mesher that regressed into
          # emitting nothing, which a ceiling alone would happily pass.
          gate_max world_mesh_mb "$WORLD_MESH"       11.5
          gate     world_mesh_mb "$WORLD_MESH"       10.0
          # Both of these are quoted in the README's headline claims and
          # neither was checked. The packed vertex is exactly 12 bytes by
          # static_assert in the header, so this gate is not guarding the
          # layout - it is guarding that --bench still REPORTS what the
          # README says it reports, which is the half a static_assert
          # cannot cover.
          gate_max vertex_bytes  "$VERTEX_BYTES"      12
          gate     vertex_bytes  "$VERTEX_BYTES"      12
          # The naive whole-world footprint is the left-hand end of the
          # "127 MB to 10.9 MB" span, so a drift here silently rescales the
          # headline ratio without touching the shipped number. Bounded
          # both sides for the same reason world_mesh_mb is: a naive
          # baseline that collapsed would make the ratio look better.
          gate_max world_mesh_naive_mb "$NAIVE_MESH" 132.0
          gate     world_mesh_naive_mb "$NAIVE_MESH" 121.0

  sanitizers:
    name: sanitizers (TSan + ASan/UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang \
            libgl1-mesa-dev libglu1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      # ThreadSanitizer over the lock-free queue + worker pool, then ASan+UBSan
      # over the full logic suite. Any race / memory error / UB (outside the
      # documented FastNoiseLite hash-overflow suppression) fails the job.
      - name: Run sanitizer suite
        run: scripts/run_sanitizers.sh
